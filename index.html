            <div id="login-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded border border-red-300"></div>

        <div id="page-signup" class="hidden-page w-full max-w-md bg-white rounded-lg shadow-lg p-6">

            <div id="signup-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded border border-red-300"></div>

                    <div class="w-1/2">
                        <label class="block text-sm font-medium mb-1">First Name</label>
                        <input type="text" id="signup-first" class="w-full border rounded p-2" placeholder="John">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-sm font-medium mb-1">Last Name</label>
                        <input type="text" id="signup-last" class="w-full border rounded p-2" placeholder="Doe">

                </div>
                <div>

                <button onclick="registerUser()" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">Create Account</button>
                
                <div class="text-center text-sm text-blue-600 mt-4">
                    <a href="#" onclick="showPage('page-login')" class="hover:underline">Back to Login</a>
